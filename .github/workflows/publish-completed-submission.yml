name: Publish completed UEM submissions

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: uem-submission-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.issue.title, '[飞跃手册投稿] ') && github.event.issue.state_reason == 'completed' && github.event.sender.login == 'FuTseYi' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Create source update token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: UEM-Feiyue
          repositories: UEM-Feiyue-Site-Source
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Import reviewed Issue
        run: |
          set -euo pipefail
          git config user.name '${{ steps.app.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publication origin/main
            python scripts/import_completed_submission.py
            git add -A -- content/community/
            if git diff --cached --quiet; then
              echo 'Already published'
              exit 0
            fi
            git diff --cached --name-only | grep -Ex 'content/community/issue-[0-9]+\.md' >/dev/null
            python -m unittest discover -s tests -t . -p 'test_*.py'
            python preview.py --build-only
            git commit -m "docs: publish reviewed UEM submission #${ISSUE_NUMBER}"
            if git push origin HEAD:main; then
              gh issue edit "$ISSUE_NUMBER" --remove-label submission:pending --remove-label submission:failed --add-label submission:published
              exit 0
            fi
          done
          exit 1
      - name: Mark publication failure
        if: ${{ failure() }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label submission:failed

  dismiss:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.issue.title, '[飞跃手册投稿] ') && github.event.issue.state_reason != 'completed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clear pending review status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label submission:pending
