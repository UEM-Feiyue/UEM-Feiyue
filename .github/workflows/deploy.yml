name: Build and publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - run: python preview.py --build-only
      - name: Record source and build run
        env:
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          export SOURCE_SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('_site/build-info.json').write_text(json.dumps({
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': os.environ['SOURCE_SHA'],
              'source_run': os.environ['SOURCE_RUN'],
          }, indent=2) + '\n', encoding='utf-8')
          Path('_site/vercel.json').write_text(json.dumps({
              'git': {'deploymentEnabled': {'main': True, '*': False}}
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Create publishing token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: UEM-Feiyue
          repositories: UEM-Feiyue.github.io
          permission-contents: write
      - name: Resolve publishing bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Check out Published
        uses: actions/checkout@v4
        with:
          repository: UEM-Feiyue/UEM-Feiyue.github.io
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: published
          persist-credentials: true
      - name: Publish changed output
        run: |
          if [ -z "$(rsync -rcni --delete --exclude='.git/' --exclude='build-info.json' _site/ published/)" ]; then
            echo 'Static output unchanged'
            exit 0
          fi
          rsync -a --delete --exclude='.git/' _site/ published/
          cd published
          git config user.name '${{ steps.app.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.bot.outputs.id }}+${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish source ${SOURCE_SHA}"
          git push origin HEAD:main
